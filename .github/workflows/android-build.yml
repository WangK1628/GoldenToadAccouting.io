name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Locate and rename APK
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found APK: $APK"
          cp "$APK" golden-toad-accounting.apk
          ls -lh golden-toad-accounting.apk
      - uses: actions/upload-artifact@v4
        with:
          name: golden-toad-accounting-apk
          path: golden-toad-accounting.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: golden-toad-accounting.apk
          generate_release_notes: true
          body: |
            金蝉记账 v0.3.0 Android 安装包。

            - 安装后可语音 / 打字记账
            - 数据保存在手机本地
            - 首次安装需允许「未知来源」
